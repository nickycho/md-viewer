<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="highlight.min.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 40px;
    color: #1d1d1f;
    background: #ffffff;
    word-wrap: break-word;
  }
  body.dark {
    color: #f5f5f7;
    background: #1c1c1e;
  }
  h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    line-height: 1.3;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
  }
  h1 { font-size: 2em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.3em; }
  body.dark h2 { border-bottom-color: #3a3a3c; }
  a { color: #0071e3; text-decoration: none; }
  a:hover { text-decoration: underline; }
  body.dark a { color: #2997ff; }
  code {
    font-family: 'SF Mono', Menlo, 'Courier New', monospace;
    font-size: 0.875em;
    background: #f5f5f7;
    padding: 0.2em 0.4em;
    border-radius: 4px;
  }
  body.dark code { background: #2c2c2e; }
  pre {
    background: #f5f5f7;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1em 0;
  }
  body.dark pre { background: #2c2c2e; }
  pre code { background: none; padding: 0; font-size: 0.875em; }
  blockquote {
    border-left: 4px solid #d0d0d0;
    margin: 1em 0;
    padding: 0.5em 1em;
    color: #666;
  }
  body.dark blockquote { border-left-color: #48484a; color: #aeaeb2; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid #d0d0d0; padding: 8px 12px; text-align: left; }
  body.dark th, body.dark td { border-color: #48484a; }
  th { background: #f5f5f7; font-weight: 600; }
  body.dark th { background: #2c2c2e; }
  img { max-width: 100%; height: auto; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 2em 0; }
  body.dark hr { border-top-color: #3a3a3c; }
</style>
</head>
<body>
<div id="content"></div>
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<script>
  marked.use({ gfm: true, breaks: false });

  const md = `{{MARKDOWN_CONTENT}}`;
  document.getElementById('content').innerHTML = marked.parse(md);

  document.querySelectorAll('pre code').forEach(function(el) {
    hljs.highlightElement(el);
  });

  function setDarkMode(isDark) {
    document.body.classList.toggle('dark', isDark);
  }
</script>
</body>
</html>
